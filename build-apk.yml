name: Construire l'APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer le projet Android
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 exceljs@4.4.0 jszip@3.10.1
          mkdir www
          cp index.html www/
          cp node_modules/exceljs/dist/exceljs.min.js node_modules/jszip/dist/jszip.min.js www/
          echo '{"appId":"ci.rsu.suivi","appName":"TIA Suivi","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Suivi-RSU-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
