const pH=()=>{const ys=[...new Set(S.mo.map(o=>o.y))];return"<h3>Périodes</h3><div class=\"chips\">"+(S.mo.map(o=>"<span>"+mname(o)+' <button data-x="'+mk(o)+'">✕</button></span>').join("")||"Aucune période")+'</div><h4>Ajouter</h4><div class="g2"><select id="pm">'+MF.map((n,i)=>'<option value="'+(i+1)+'">'+n+"</option>").join("")+'</select><input id="py" type="number" value="'+new Date().getFullYear()+'"></div><label>Premier jour de suivi (facultatif)<input id="ps" type="number" min="1" max="31" placeholder="1"></label><div class="bt"><button data-a="m" class="pr">Ajouter le mois</button><button data-a="y">Ajouter l’année entière</button></div>'+(ys.length?'<h4>Supprimer une année</h4><div class="g2"><select id="pd">'+ys.map(y=>"<option>"+y+"</option>").join("")+'</select><button data-a="dy" class="dn">Supprimer l’année</button></div>':"")+'<div class="bt"><button data-a="c">Fermer</button></div>'};
function periods(){const o=modal(pH()),box=o.firstChild,add=(y,m,s)=>{if(!S.mo.some(x=>x.y==y&&x.m==m))S.mo.push({y,m,s:Math.min(Math.max(s||1,1),dim({y,m}))})};
o.onclick=async e=>{const t=e.target.closest("button");if(!t)return;const a=t.dataset.a,v=id=>o.querySelector(id).value;
if(a=="c"){o.remove();return refresh()}
if(a=="m"||a=="y"){const y=Math.floor(+v("#py"));if(!(y>=2000&&y<=2100))return toast("Année invalide (2000–2100)");if(a=="m")add(y,+v("#pm"),Math.floor(+v("#ps")));else for(let m=1;m<=12;m++)add(y,m);srt();sv();box.innerHTML=pH();return}
if(t.dataset.x){if(await ask("<h3>Supprimer ce mois ?</h3><p>"+mname(S.mo.find(x=>mk(x)==t.dataset.x))+" et toutes ses saisies seront effacés.</p>",[["Annuler",0],["Supprimer",1,"dn"]])){delMonth(t.dataset.x);sv();box.innerHTML=pH()}return}
if(a=="dy"){const y=+v("#pd");if(await ask("<h3>Supprimer l’année "+y+" ?</h3><p>Tous les mois de "+y+" et leurs saisies seront effacés.</p>",[["Annuler",0],["Supprimer",1,"dn"]])){S.mo.filter(x=>x.y==y).forEach(x=>delMonth(mk(x)));sv();box.innerHTML=pH()}}}}
/* Exports */
const L=n=>{let s="";for(;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
async function out(name,blob){const C=window.Capacitor,P=C&&C.Plugins;
if(P&&P.Filesystem&&P.Share&&C.isNativePlatform&&C.isNativePlatform()){try{const b=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(blob)});const w=await P.Filesystem.writeFile({path:name,data:b,directory:"CACHE"});await P.Share.share({title:name,url:w.uri,dialogTitle:"Enregistrer ou envoyer le fichier"})}catch(e){if(!/cancel/i.test(e&&e.message||""))toast("Export impossible")}return}
const d=window.claude?await claude.use("downloads"):null;
if(d){try{await d.save({filename:name,data:blob})}catch(e){if(!e||e.code!="declined")toast("Export impossible ("+((e&&e.code)||"erreur")+")")}return}
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function sheet(wb,M){const ws=wb.addWorksheet(M.sheet),n=M.head.length,B={style:"thin",color:{argb:"FFBBBBBB"}},fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}}),O=S.obj||1;
ws.addRow([M.title]);ws.mergeCells(1,1,1,n);const t=ws.getRow(1).getCell(1);ws.getRow(1).height=24;t.font={bold:true,size:13,color:{argb:"FFFFFFFF"}};t.fill=fill("FF1F3864");t.alignment={horizontal:"center",vertical:"middle"};
const h=ws.addRow(M.head);if(M.sub)M.sub.forEach((s,i)=>h.getCell(3+i).value=M.head[2+i]+"\n"+s);h.height=30;h.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill=fill("FF2E75B6");c.alignment={horizontal:"center",vertical:"middle",wrapText:true}});
const r0=h.number+1;
M.rows.forEach(r=>{const w=ws.addRow(r),k=w.number;w.getCell(M.tc+1).value={formula:"SUM("+L(M.c0+1)+k+":"+L(M.c1+1)+k+")",result:r[M.tc]};if(M.pc>0){w.getCell(M.pc+1).value={formula:L(M.tc+1)+k+"/"+O,result:r[M.pc]};w.getCell(M.pc+1).numFmt="0.00%"}});
const r1=ws.rowCount;
M.foot.forEach((f,i)=>{const w=ws.addRow(f),k=w.number;
for(let c=M.c0;c<=M.tc;c++){if(i==0&&r1>=r0)w.getCell(c+1).value={formula:"SUM("+L(c+1)+r0+":"+L(c+1)+r1+")",result:f[c]};if(M.foot2&&i==1){w.getCell(c+1).value={formula:L(c+1)+(k-1)+"/"+O,result:f[c]};w.getCell(c+1).numFmt="0.00%"}}
if(M.pc>0){if(i==0)w.getCell(M.pc+1).value={formula:L(M.tc+1)+k+"/"+O,result:f[M.pc]};w.getCell(M.pc+1).numFmt="0.00%"}
w.eachCell(c=>{c.font={bold:true};c.fill=fill("FFE2EFDA")})});
ws.eachRow((w,k)=>{if(k>1)w.eachCell({includeEmpty:true},(c,ci)=>{c.border={top:B,left:B,bottom:B,right:B};if(ci>2)c.alignment={horizontal:"center",vertical:"middle",wrapText:k==2}})});
ws.getColumn(1).width=16;ws.getColumn(2).width=30;for(let c=3;c<=n;c++)ws.getColumn(c).width=M.sub?7:14;ws.views=[{state:"frozen",xSplit:2,ySplit:2}]}
async function xlsx(Ms,name){const wb=new ExcelJS.Workbook();Ms.forEach(M=>sheet(wb,M));await out(name,new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}
function tbl(M){const n=M.head.length,sz=n>14?12:17,W=15700,w0=n>14?[1500,2600]:[1900,3000],o=Math.floor((W-w0[0]-w0[1])/(n-2)),wd=i=>i<2?w0[i]:o;
const cell=(t,x)=>'<w:tc><w:tcPr><w:tcW w:w="'+x.w+'" w:type="dxa"/>'+(x.s?'<w:gridSpan w:val="'+x.s+'"/>':"")+(x.f?'<w:shd w:val="clear" w:color="auto" w:fill="'+x.f+'"/>':"")+'<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="'+(x.l?"left":"center")+'"/></w:pPr><w:r><w:rPr>'+(x.b?"<w:b/>":"")+(x.c?'<w:color w:val="'+x.c+'"/>':"")+'<w:sz w:val="'+sz+'"/></w:rPr><w:t xml:space="preserve">'+esc(t)+"</w:t></w:r></w:p></w:tc>";
const row=(c,hd)=>"<w:tr>"+(hd?"<w:trPr><w:tblHeader/></w:trPr>":"")+c+"</w:tr>";
let t=row(M.head.map((x,i)=>cell(x,{w:wd(i),f:"2E75B6",c:"FFFFFF",b:1,l:i<2})).join(""),1);
t+=M.rows.map((r,ri)=>row(r.map((v,ci)=>cell(ci<2?v:fm(M,"r",ri,ci,v),{w:wd(ci),l:ci<2,b:ci==M.tc,f:ri%2?"F2F6FB":""})).join(""))).join("");
t+=M.foot.map((r,ri)=>row(cell(r[0],{w:w0[0]+w0[1],s:2,l:1,b:1,f:"E2EFDA"})+r.slice(2).map((v,j)=>cell(fm(M,"f",ri,j+2,v),{w:wd(j+2),b:1,f:"E2EFDA"})).join(""))).join("");
const p=(x,s,b)=>'<w:p><w:pPr><w:spacing w:after="80"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr>'+(b?"<w:b/>":"")+'<w:sz w:val="'+s+'"/></w:rPr><w:t xml:space="preserve">'+esc(x)+"</w:t></w:r></w:p>";
const bx=["top","left","bottom","right","insideH","insideV"].map(s=>"<w:"+s+' w:val="single" w:sz="4" w:space="0" w:color="999999"/>').join("");
return p(M.title,28,1)+p("Édité le "+new Date().toLocaleDateString("fr-FR")+" · Agents : "+M.rows.length+" · © MARIUS TIA",18)+'<w:tbl><w:tblPr><w:tblW w:w="'+W+'" w:type="dxa"/><w:tblBorders>'+bx+'</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'+Array.from({length:n},(_,i)=>'<w:gridCol w:w="'+wd(i)+'"/>').join("")+"</w:tblGrid>"+t+"</w:tbl>"}
async function docx(Ms,name){const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',Z=new JSZip(),br='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
Z.file("[Content_Types].xml",X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
Z.file("_rels/.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
Z.file("word/document.xml",X+'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+Ms.map(tbl).join(br)+'<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="567" w:right="567" w:bottom="567" w:left="567" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>');
await out(name,await Z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}))}
async function runExport(O){const V=O.all?S.ag.map((_,i)=>i):O.ags,r=O.all?null:O.r,ms=S.mo.filter(o=>days(o,r).length);
if(!ms.length||!V.length)return toast("Aucune donnée à exporter pour ce choix");
const Ms=[rmodel(V,r,ms),...ms.map(o=>mmodel(o,V,r))],nm="Suivi_RSU_"+(O.all?"COMPLET":"PERIODE")+"_"+new Date().toISOString().slice(0,10)+(O.fmt=="x"?".xlsx":".docx");
try{O.fmt=="x"?await xlsx(Ms,nm):await docx(Ms,nm)}catch(e){toast("Export impossible (bibliothèque non chargée ?)")}}
const iso=(o,d)=>o.y+"-"+p2(o.m)+"-"+p2(d);
async function exportDlg(){if(!S.mo.length)return toast("Aucune période à exporter");const f=S.mo[0],l=S.mo[S.mo.length-1];
const get=fmt=>o=>{if(o.querySelector("input[name=sc]:checked").value=="a")return{fmt,all:true};const a=o.querySelector("#d1").value,b=o.querySelector("#d2").value,ags=[...o.querySelectorAll(".ags input:checked")].map(x=>+x.value);
if(!a||!b||a>b){toast("Période invalide");return null}if(!ags.length){toast("Choisissez au moins un agent");return null}return{fmt,all:false,r:[+a.replace(/-/g,""),+b.replace(/-/g,"")],ags}};
const O=await ask('<h3>Exporter</h3><label><input type="radio" name="sc" value="a" checked>Toutes les données</label><label><input type="radio" name="sc" value="c">Choisir la période et les agents</label><div id="cx" hidden><div class="g2"><label>Du<input type="date" id="d1" value="'+iso(f,f.s||1)+'"></label><label>Au<input type="date" id="d2" value="'+iso(l,dim(l))+'"></label></div><p class="mu">Agents : <button data-k="1">Tout cocher</button> <button data-k="0">Tout décocher</button></p><div class="ags">'+S.ag.map((x,i)=>'<label><input type="checkbox" value="'+i+'" checked>'+esc(x[0]+" "+x[1])+"</label>").join("")+"</div></div>",[["Annuler",null],["Word",get("w"),"pr"],["Excel",get("x"),"pr"]],o=>{o.onchange=e=>{if(e.target.name=="sc")o.querySelector("#cx").hidden=e.target.value=="a"};o.addEventListener("click",e=>{const k=e.target.dataset.k;if(k!=null)o.querySelectorAll(".ags input").forEach(x=>x.checked=k=="1")})});
if(O)runExport(O)}
/* Réglages et suppression */
async function wipe(){const ex=await ask("<h3>Exporter avant de supprimer ?</h3><p>Vous allez supprimer toutes les données de cet onglet. Voulez-vous d’abord les exporter ?</p>",[["Annuler",null],["Non, continuer sans exporter","n"],["Exporter en Word","w","pr"],["Exporter en Excel","x","pr"]]);
if(!ex)return;if(ex!="n"){await runExport({fmt:ex,all:true})}
const c=await ask('<h3>Confirmation finale</h3><p>Toutes les saisies de cet onglet seront définitivement effacées. Tapez <b>SUPPRIMER</b> pour confirmer.</p><input type="text" id="cf" autocomplete="off"><label><input type="checkbox" id="wa">Supprimer aussi les agents et les périodes</label>',[["Annuler",null],["Tout supprimer",o=>o.querySelector("#cf").value.trim().toUpperCase()=="SUPPRIMER"?{a:o.querySelector("#wa").checked}:false,"dn"]]);
if(c===null)return;if(!c)return toast("Mot de confirmation incorrect : rien n’a été supprimé");
S.e={};if(c.a){S.ag=[];S.mo=[]}sv();refresh();toast("Données supprimées")}
async function settings(){const r=await ask('<h3>Réglages</h3><label>Titre de l’application<input type="text" id="s1" value="'+esc(S.title)+'"></label><label>Objectif (nombre d’enquêtes)<input type="number" id="s2" min="1" value="'+S.obj+'"></label><p class="mu">Les données sont conservées dans la mémoire de l’appareil.</p>',[["Annuler",null],["Supprimer toutes les données","w","dn"],["Enregistrer",o=>({t:o.querySelector("#s1").value.trim(),b:Math.floor(+o.querySelector("#s2").value)}),"pr"]]);
if(r=="w")return wipe();if(!r)return;if(!r.t||!(r.b>0))return toast("Titre et objectif valides requis");S.title=r.t;S.obj=r.b;sv();render()}
$("bm").onclick=menu;$("bi").onclick=backupDlg;$("ba").onclick=agentDlg;
applyTheme();$("ft").textContent="© "+new Date().getFullYear()+" MARIUS TIA · Tous droits réservés";fixK();ctl();render();
